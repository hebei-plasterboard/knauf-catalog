<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>走进可耐福</title>
<style>
:root {
  --knauf-deep: #003B71;
  --knauf-mid: #5BA0D2;
  --knauf-light: #E8F4FD;
  --knauf-white: #FFFFFF;
  --text-primary: #1A1A2E;
  --text-secondary: #4A5568;
  --text-muted: #A0AEC0;
  --bg-page: #F0F4F8;
  --gold: #C8960C;
  --silver: #6B7280;
  --green: #0D9488;
  --purple: #7C3AED;
  --red: #DC2626;
  --card-shadow: 0 2px 8px rgba(0,59,113,0.08);
  --card-hover: 0 4px 16px rgba(0,59,113,0.14);
  --divider: #E2E8F0;
  --radius: 12px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 12px);
  --max-width: 480px;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  background: var(--bg-page);
  color: var(--text-primary);
  line-height: 1.5;
  max-width: var(--max-width);
  margin: 0 auto;
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

#app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

/* Header */
#header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: linear-gradient(135deg, var(--knauf-deep), #002952);
  color: white;
  padding: calc(12px + var(--safe-top)) 16px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 52px;
  box-shadow: 0 2px 12px rgba(0,59,113,0.3);
}

.header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 2px;
  color: white;
}

.header-divider {
  width: 1px;
  height: 20px;
  background: rgba(255,255,255,0.3);
}

#breadcrumb {
  font-size: 13px;
  color: rgba(255,255,255,0.85);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 200px;
}

#breadcrumb span {
  color: rgba(255,255,255,0.5);
  margin: 0 4px;
}

#breadcrumb .clickable {
  color: rgba(255,255,255,0.7);
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
}

#homeBtn {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.25);
  color: white;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 16px;
  transition: background 0.2s;
  flex-shrink: 0;
}

#homeBtn:active {
  background: rgba(255,255,255,0.3);
}

#homeBtn.hidden {
  display: none;
}

/* Main view container */
#view-container {
  flex: 1;
  position: relative;
  padding-bottom: var(--safe-bottom);
}

.view {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  min-height: 100%;
  padding: 16px;
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s ease;
  will-change: transform, opacity;
}

.view.active {
  position: relative;
  transform: translateX(0);
  opacity: 1;
  z-index: 1;
}

.view.inactive-right {
  transform: translateX(100%);
  opacity: 0;
  pointer-events: none;
}

.view.inactive-left {
  transform: translateX(-30%);
  opacity: 0;
  pointer-events: none;
}

/* Welcome Banner */
.welcome-banner {
  background: linear-gradient(135deg, var(--knauf-deep) 0%, #004B87 40%, #002952 100%);
  border-radius: var(--radius);
  padding: 28px 20px 24px;
  margin-bottom: 16px;
  text-align: center;
  color: white;
  position: relative;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,59,113,0.25);
}

.welcome-banner::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(ellipse at 30% 20%, rgba(91,160,210,0.3) 0%, transparent 60%),
              radial-gradient(ellipse at 70% 80%, rgba(0,59,113,0.4) 0%, transparent 60%);
  animation: bannerGlow 6s ease-in-out infinite;
}

@keyframes bannerGlow {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(-10px, -5px); }
}

.welcome-banner > * {
  position: relative;
  z-index: 1;
}

.welcome-icon {
  font-size: 36px;
  margin-bottom: 8px;
  display: block;
}

.welcome-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 2px;
  margin-bottom: 4px;
}

.welcome-subtitle {
  font-size: 13px;
  opacity: 0.85;
  margin-bottom: 10px;
}

.welcome-stats {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 12px;
}

.welcome-stat {
  text-align: center;
}

.welcome-stat-num {
  font-size: 20px;
  font-weight: 700;
  color: var(--knauf-mid);
}

.welcome-stat-label {
  font-size: 10px;
  opacity: 0.7;
  margin-top: 2px;
}

/* Card Grid */
.card-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

@media (max-width: 340px) {
  .card-grid { grid-template-columns: 1fr; }
}

.card {
  background: var(--knauf-white);
  border-radius: var(--radius);
  padding: 18px 14px;
  box-shadow: var(--card-shadow);
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 6px;
  border-left: 3px solid transparent;
  animation: cardFadeIn 0.5s ease both;
}

.card:nth-child(1) { animation-delay: 0.05s; }
.card:nth-child(2) { animation-delay: 0.1s; }
.card:nth-child(3) { animation-delay: 0.15s; }
.card:nth-child(4) { animation-delay: 0.2s; }
.card:nth-child(5) { animation-delay: 0.25s; }
.card:nth-child(6) { animation-delay: 0.3s; }

@keyframes cardFadeIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.card:active {
  transform: scale(0.97);
  box-shadow: var(--card-hover);
}

.card-icon {
  font-size: 32px;
  line-height: 1;
}

.card-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
}

.card-subtitle {
  font-size: 11px;
  color: var(--text-muted);
}

.card-arrow {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 14px;
  opacity: 0.5;
}

/* Card accent colors */
.card-accent-gold { border-left-color: var(--gold); }
.card-accent-silver { border-left-color: var(--silver); }
.card-accent-green { border-left-color: var(--green); }
.card-accent-blue { border-left-color: var(--knauf-mid); }
.card-accent-purple { border-left-color: var(--purple); }
.card-accent-more { border-left: 3px dashed var(--text-muted); }

/* Section header in sub-view */
.section-header {
  text-align: center;
  margin-bottom: 16px;
}

.section-header-icon {
  font-size: 40px;
  display: block;
  margin-bottom: 4px;
}

.section-header-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--knauf-deep);
}

.section-header-desc {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* Detail View */
.detail-hero {
  background: linear-gradient(135deg, var(--knauf-deep), #004B87);
  border-radius: var(--radius);
  padding: 24px 20px;
  margin-bottom: 16px;
  color: white;
  text-align: center;
}

.detail-hero.premium {
  background: linear-gradient(135deg, #1a1a2e, var(--knauf-deep));
  border: 1px solid var(--gold);
}

.detail-hero.mid {
  background: linear-gradient(135deg, #1a1a2e, #2d3748);
  border: 1px solid var(--silver);
}

.detail-hero.eco {
  background: linear-gradient(135deg, #064e3b, #0d9488);
}

.detail-badge {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  margin-bottom: 8px;
}

.badge-premium { background: var(--gold); color: white; }
.badge-mid { background: var(--silver); color: white; }
.badge-eco { background: var(--green); color: white; }
.badge-info { background: var(--knauf-mid); color: white; }

.detail-hero h2 {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 4px;
}

.detail-hero .tagline {
  font-size: 13px;
  opacity: 0.85;
}

/* Spec cards */
.spec-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 16px;
}

.spec-card {
  background: var(--knauf-white);
  border-radius: var(--radius);
  padding: 14px 12px;
  text-align: center;
  box-shadow: var(--card-shadow);
}

.spec-value {
  font-size: 22px;
  font-weight: 700;
  color: var(--knauf-deep);
}

.spec-value.red { color: var(--red); }
.spec-value.green { color: var(--green); }

.spec-label {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* Info card */
.info-card {
  background: var(--knauf-white);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--card-shadow);
}

.info-card h3 {
  font-size: 15px;
  font-weight: 600;
  color: var(--knauf-deep);
  margin-bottom: 8px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--divider);
}

.info-card p, .info-card li {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.7;
}

.info-card ul {
  list-style: none;
  padding: 0;
}

.info-card li {
  padding: 3px 0;
  padding-left: 18px;
  position: relative;
}

.info-card li::before {
  content: '✓';
  position: absolute;
  left: 0;
  color: var(--green);
  font-weight: 700;
  font-size: 12px;
}

/* Feature tags */
.tag-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}

.tag {
  background: var(--knauf-light);
  color: var(--knauf-deep);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
}

/* Comparison Bar Chart */
.bar-chart {
  margin-bottom: 12px;
}

.bar-row {
  margin-bottom: 12px;
}

.bar-labels {
  display: flex;
  justify-content: space-between;
  margin-bottom: 4px;
  font-size: 12px;
}

.bar-label-name {
  color: var(--text-secondary);
  font-weight: 500;
}

.bar-label-value {
  color: var(--text-primary);
  font-weight: 600;
}

.bar-track {
  height: 8px;
  background: var(--divider);
  border-radius: 4px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
}

.bar-fill.knauf { background: linear-gradient(90deg, var(--knauf-deep), var(--knauf-mid)); }
.bar-fill.competitor { background: linear-gradient(90deg, #94a3b8, #cbd5e1); }
.bar-fill.standard { background: linear-gradient(90deg, #e2e8f0, #f1f5f9); }

.bar-legend {
  display: flex;
  gap: 16px;
  margin-top: 8px;
  font-size: 11px;
  color: var(--text-muted);
}

.bar-legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
}

.bar-legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 2px;
}

.bar-legend-dot.knauf { background: var(--knauf-deep); }
.bar-legend-dot.competitor { background: #94a3b8; }
.bar-legend-dot.standard { background: #e2e8f0; }

/* Comparison table */
.comp-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 11px;
  margin-bottom: 12px;
}

.comp-table th {
  background: var(--knauf-deep);
  color: white;
  padding: 8px 6px;
  font-weight: 500;
  text-align: center;
}

.comp-table td {
  padding: 8px 6px;
  text-align: center;
  border-bottom: 1px solid var(--divider);
}

.comp-table .highlight {
  background: var(--knauf-light);
  font-weight: 600;
  color: var(--knauf-deep);
}

.comp-table .check {
  color: var(--green);
  font-weight: 700;
}

.comp-table .cross {
  color: var(--red);
}

/* Process steps */
.process-steps {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.process-step {
  background: var(--knauf-white);
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: var(--card-shadow);
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.process-step-num {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--knauf-deep);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  flex-shrink: 0;
}

.process-step-content h4 {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
}

.process-step-content p {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.6;
}

/* Toast / Coming Soon */
#toast {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  background: rgba(0, 0, 0, 0.85);
  color: white;
  padding: 16px 28px;
  border-radius: 12px;
  font-size: 15px;
  z-index: 200;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.8, 1);
  pointer-events: none;
  text-align: center;
}

#toast.show {
  transform: translate(-50%, -50%) scale(1);
}

.toast-icon {
  font-size: 32px;
  display: block;
  margin-bottom: 4px;
}

/* Back button */
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--knauf-mid);
  font-size: 13px;
  cursor: pointer;
  margin-bottom: 12px;
  padding: 4px 0;
}

.back-btn:active { opacity: 0.6; }

/* Comparison highlight card */
.highlight-card {
  background: linear-gradient(135deg, #fffbeb, #fef3c7);
  border: 1px solid #f59e0b;
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 12px;
  font-size: 13px;
  color: #92400e;
}

.highlight-card strong {
  color: #b45309;
}

/* Full-width card on mobile */
@media (max-width: 360px) {
  .spec-grid { grid-template-columns: 1fr; }
  .welcome-stats { gap: 12px; }
  .welcome-stat-num { font-size: 17px; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 0; }

/* ===== Timeline (公司发展史) ===== */
.timeline {
  position: relative;
  padding: 0 0 0 28px;
  margin: 0 4px;
}

.timeline::before {
  content: '';
  position: absolute;
  left: 10px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: linear-gradient(180deg, var(--knauf-deep), var(--knauf-mid), var(--knauf-light));
  border-radius: 1px;
}

.timeline-item {
  position: relative;
  background: var(--knauf-white);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 16px;
  box-shadow: var(--card-shadow);
  animation: cardFadeIn 0.5s ease both;
}

.timeline-item:last-child {
  margin-bottom: 0;
}

.timeline-dot {
  position: absolute;
  left: -24px;
  top: 18px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--knauf-deep);
  border: 2px solid var(--knauf-light);
  box-shadow: 0 0 0 3px var(--knauf-white);
  z-index: 2;
}

.timeline-item:first-child .timeline-dot {
  background: var(--gold);
  border-color: #fef3c7;
  box-shadow: 0 0 0 3px var(--knauf-white), 0 0 8px rgba(200,150,12,0.4);
  width: 14px;
  height: 14px;
  left: -25px;
  top: 17px;
}

.timeline-year {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  color: var(--knauf-white);
  background: var(--knauf-deep);
  padding: 2px 10px;
  border-radius: 10px;
  margin-bottom: 6px;
  letter-spacing: 0.5px;
}

.timeline-year.now {
  background: var(--gold);
}

.timeline-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 6px;
  line-height: 1.4;
}

.timeline-desc {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.7;
}

.timeline-highlight {
  display: inline-block;
  background: linear-gradient(135deg, #fffbeb, #fef3c7);
  border: 1px solid #f59e0b;
  border-radius: 8px;
  padding: 10px 14px;
  margin-top: 8px;
  font-size: 12px;
  color: #92400e;
  line-height: 1.6;
}

.timeline-highlight strong {
  color: #b45309;
}

@media (max-width: 360px) {
  .timeline { padding-left: 24px; }
  .timeline-dot { left: -20px; }
  .timeline-item:first-child .timeline-dot { left: -21px; }
}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="header-left">
      <span class="logo">KNAUF</span>
      <span class="header-divider"></span>

    </div>

    <div id="view-history" class="view inactive-right"></div>
  </div>
  <div id="toast"></div>
</div>

    "title": "公司发展史",
    "subtitle": "从1932到如今 · 德国品质的传承与创新",
    "events": [
      {
        "year": "1932",
        "title": "梦想启航",
        "desc": "阿尔方斯·可耐福(Alfons Knauf)与卡尔·可耐福(Karl Knauf)兄弟在德国巴伐利亚州获得石膏矿采矿权，创立可耐福公司。从此，两兄弟凭借对石膏这种纯天然材料的执着，开启了一段跨越近百年的传奇旅程。",
        "highlight": ""
      },
      {
        "year": "1949",
        "title": "首批产品问世",
        "desc": "二战后百废待兴，可耐福出产第一批熟石膏，为战后重建提供关键建材，正式迈入石膏产品制造领域。",
        "highlight": ""
      },
      {
        "year": "1958",
        "title": "总部扎根伊普霍芬",
        "desc": "在德国巴伐利亚州伊普霍芬(Iphofen)建造新工厂，开始规模化生产纸面石膏板及轻钢龙骨系统。伊普霍芬至今仍是可耐福集团全球总部所在地，象征品牌根基。",
        "highlight": ""
      },
      {
        "year": "1971",
        "title": "首次海外扩张",
        "desc": "在澳大利亚成立首家境外公司，标志着可耐福从德国本土企业迈向国际化的重要一步。此后数十年间，全球化步伐持续加速。",
        "highlight": ""
      },
      {
        "year": "1978",
        "title": "进军美国市场",
        "desc": "通过收购位于美国肯塔基州Shelbyville的保温材料公司，成功打入全球最大的建材市场——美国，为日后全球布局奠定基础。",
        "highlight": ""
      },
      {
        "year": "1995",
        "title": "进入中国",
        "desc": "可耐福正式进入中国市场，在安徽芜湖建立首个中国生产基地。作为最早进入中国的外资石膏建材企业之一，可耐福将德国先进的石膏板制造技术带入中国。",
        "highlight": "值得一提的是，中国龙牌(北新建材)第一条石膏板生产线及轻钢龙骨轧机设备均由可耐福德国总部引进提供，是中国最早与可耐福技术合作的企业。"
      },
      {
        "year": "1996–1998",
        "title": "全国布局加速",
        "desc": "天津生产基地(1996年)和广东东莞生产基地(1998年)相继投产，可耐福在中国形成南北呼应、覆盖全国的生产与供应网络。",
        "highlight": ""
      },
      {
        "year": "2008",
        "title": "助力北京奥运",
        "desc": "可耐福为北京奥运会多个标志性场馆提供建材支持，包括国家体育场(鸟巢)、国家游泳中心(水立方)等。这是可耐福在中国市场影响力的一次重要彰显。",
        "highlight": ""
      },
      {
        "year": "2013",
        "title": "太仓工厂投产",
        "desc": "可耐福中国第四大石膏板生产基地——江苏太仓工厂正式投产，进一步提升在华产能，巩固高端市场领先地位。",
        "highlight": ""
      },
      {
        "year": "2018",
        "title": "收购美国USG集团",
        "desc": "可耐福以约70亿美元完成对美国石膏板巨头USG集团(United States Gypsum Corporation)的收购，这是建材行业历史上规模最大的并购之一。此举使可耐福跃居全球石膏板产能首位。",
        "highlight": ""
      },
      {
        "year": "2019–2021",
        "title": "全球资源整合",
        "desc": "连续收购阿姆斯壮(Armstrong)欧亚非业务及优时吉博罗(USG Boral)，实现石膏板、天花吊顶及保温材料业务的全球全区域覆盖，进一步巩固行业领导者地位。",
        "highlight": ""
      },
      {
        "year": "2023",
        "title": "中国三十周年",
        "desc": "可耐福在中国举办三十周年庆典，回顾三十载扎根中国的发展历程。经过持续深耕，可耐福已在中国高端石膏板市场占据近四分之一份额，年提供近1.5亿平方米绿色建材产品。",
        "highlight": ""
      },
      {
        "year": "至今",
        "title": "传承五代 · 领跑全球",
        "desc": "业务遍布全球90多个国家和地区，拥有320多个生产基地、42,500多名员工。年产石膏板36.3亿平方米，超越圣戈班近30%、超越北新建材近45%。旗下拥有USG、Aquapanel、Knauf Insulation等全球顶级建材品牌。五代人用心经营，以德国品质构筑世界的理想家园。",
        "highlight": ""
      }
    ]
  }
}
</script>

<script>
(function() {
  // Parse data
  var data = JSON.parse(document.getElementById('data-payload').textContent);
  var meta = data.meta;
  var welcome = data.welcome;
  var sections = data.sections;

  // State
  var nav = { depth: 0, sectionId: null, itemId: null, sectionIndex: -1, itemIndex: -1, page: null };
  var viewHome = document.getElementById('view-home');
  var viewSub = document.getElementById('view-sub');
  var viewDetail = document.getElementById('view-detail');
  var viewHistory = document.getElementById('view-history');
  var breadcrumb = document.getElementById('breadcrumb');
  var homeBtn = document.getElementById('homeBtn');
  var toast = document.getElementById('toast');
  var toastTimer = null;

  // Icons
  var sectionIcons = { gypsum: '📦', stud: '🔩', plaster: '🏗️', workflow: '📋' };

  // Init
  function init() {
    renderHome();
    window.addEventListener('popstate', function(e) {
      if (e.state) {
        nav = e.state;
        updateView();
      } else {
        goHome(true);
      }
    });
  }

  // Toast
  function showToast(msg, icon) {
    if (toastTimer) clearTimeout(toastTimer);
    toast.innerHTML = (icon ? '<span class="toast-icon">' + icon + '</span>' : '') + msg;
    toast.classList.add('show');
    toastTimer = setTimeout(function() {
      toast.classList.remove('show');
    }, 1800);
  }

  // Navigation
  function pushNav() {
    try {
      history.pushState({ depth: nav.depth, sectionId: nav.sectionId, itemId: nav.itemId, sectionIndex: nav.sectionIndex, itemIndex: nav.itemIndex, page: nav.page }, '', '');
    } catch(e) {}
  }

  window.goHome = function(silent) {
    nav = { depth: 0, sectionId: null, itemId: null, sectionIndex: -1, itemIndex: -1, page: null };
    if (!silent) pushNav();
    updateView();
  };

  window.goSection = function(sectionId) {
    var idx = -1;
    for (var i = 0; i < sections.length; i++) {
      if (sections[i].id === sectionId) { idx = i; break; }
    }
    nav = { depth: 1, sectionId: sectionId, itemId: null, sectionIndex: idx, itemIndex: -1 };
    pushNav();
    updateView();
  };

  window.goDetail = function(itemId) {
    var section = sections[nav.sectionIndex];
    var idx = -1;
    for (var i = 0; i < section.items.length; i++) {
      if (section.items[i].id === itemId) { idx = i; break; }
    }
    nav.itemId = itemId;
    nav.itemIndex = idx;
    nav.depth = 2;
    pushNav();
    updateView();
  };

  window.goHistory = function() {
    nav.page = 'history';
    nav.depth = 0;
    pushNav();
    updateView();
  };

  window.goBack = function() {
    if (nav.page === 'history') {
      nav.page = null;
      nav.depth = 0;
    } else if (nav.depth === 2) {
      nav.depth = 1;
      nav.itemId = null;
      nav.itemIndex = -1;
    } else if (nav.depth === 1) {
      nav.depth = 0;
      nav.sectionId = null;
      nav.sectionIndex = -1;
    }
    pushNav();
    updateView();
  };

  function updateView() {
    // Header
    if (nav.page === 'history') {
      breadcrumb.innerHTML = '<span class="clickable" onclick="goHome()">首页</span><span> › </span>公司发展史';
      homeBtn.classList.remove('hidden');
    } else if (nav.depth === 0) {
      breadcrumb.innerHTML = '首页';
      homeBtn.classList.add('hidden');
    } else if (nav.depth === 1) {
      var sec = sections[nav.sectionIndex];
      breadcrumb.innerHTML = '<span class="clickable" onclick="goHome()">首页</span><span> › </span>' + sec.title;
      homeBtn.classList.remove('hidden');
    } else if (nav.depth === 2) {
      var sec2 = sections[nav.sectionIndex];
      var item = sec2.items[nav.itemIndex];
      breadcrumb.innerHTML = '<span class="clickable" onclick="goHome()">首页</span><span> › </span><span class="clickable" onclick="goSection(\'' + sec2.id + '\')">' + sec2.title + '</span><span> › </span>' + item.name;
      homeBtn.classList.remove('hidden');
    }

    // Views
    viewHome.className = 'view';
    viewSub.className = 'view';
    viewDetail.className = 'view';
    viewHistory.className = 'view';

    if (nav.page === 'history') {
      viewHome.classList.add('inactive-left');
      viewSub.classList.add('inactive-left');
      viewDetail.classList.add('inactive-left');
      viewHistory.classList.add('active');
      renderHistory();
    } else if (nav.depth === 0) {
      viewHome.classList.add('active');
      viewSub.classList.add('inactive-right');
      viewDetail.classList.add('inactive-right');
      viewHistory.classList.add('inactive-right');
    } else if (nav.depth === 1) {
      viewHome.classList.add('inactive-left');
      viewSub.classList.add('active');
      viewDetail.classList.add('inactive-right');
      viewHistory.classList.add('inactive-right');
      renderSub();
    } else if (nav.depth === 2) {
      viewHome.classList.add('inactive-left');
      viewSub.classList.add('inactive-left');
      viewDetail.classList.add('active');
      viewHistory.classList.add('inactive-right');
      renderDetail();
    }

    // Scroll to top
    document.getElementById('view-container').scrollTop = 0;
    window.scrollTo(0, 0);
  }

  // Render History
  function renderHistory() {
    var hist = data.history;
    var events = hist.events;
    var h = '';

    // Header
    h += '<div class="section-header">';
    h += '<span class="section-header-icon">📜</span>';
    h += '<div class="section-header-title">' + hist.title + '</div>';
    h += '<div class="section-header-desc">' + hist.subtitle + '</div>';
    h += '</div>';

    // Timeline
    h += '<div class="timeline">';
    for (var i = 0; i < events.length; i++) {
      var e = events[i];
      var isLast = (i === events.length - 1);
      h += '<div class="timeline-item" style="animation-delay:' + (i * 0.08) + 's">';
      h += '<div class="timeline-dot"></div>';
      h += '<span class="timeline-year' + (isLast ? ' now' : '') + '">' + e.year + '</span>';
      h += '<div class="timeline-title">' + e.title + '</div>';
      h += '<div class="timeline-desc">' + e.desc + '</div>';
      if (e.highlight) {
        h += '<div class="timeline-highlight">' + e.highlight + '</div>';
      }
      h += '</div>';
    }
    h += '</div>';

    viewHistory.innerHTML = h;
  }

  // Render Home
  function renderHome() {
    var h = '';
    // Welcome banner
    h += '<div class="welcome-banner">';
    h += '<span class="welcome-icon">🏗️</span>';
    h += '<div class="welcome-title">' + welcome.greeting + '</div>';
    h += '<div class="welcome-subtitle">' + welcome.subtitle + '</div>';
    h += '<div style="font-size:11px;opacity:0.7;">' + welcome.tagline + '</div>';
    h += '<div class="welcome-stats">';
    for (var i = 0; i < welcome.stats.length; i++) {
      var s = welcome.stats[i];
      h += '<div class="welcome-stat"><div class="welcome-stat-num">' + s.num + '</div><div class="welcome-stat-label">' + s.label + '</div></div>';
    }
    h += '</div>';
    h += '<div style="margin-top:14px;cursor:pointer;" onclick="event.stopPropagation();goHistory();">';
    h += '<span style="display:inline-block;padding:6px 18px;border:1px solid rgba(255,255,255,0.4);border-radius:20px;font-size:12px;color:rgba(255,255,255,0.9);letter-spacing:1px;">📜 了解发展历程 →</span>';
    h += '</div>';
    h += '</div>';

    // Section cards
    h += '<div class="card-grid">';
    var accents = ['card-accent-gold', 'card-accent-blue', 'card-accent-green', 'card-accent-purple'];
    for (var i = 0; i < sections.length; i++) {
      var sec = sections[i];
      h += '<div class="card ' + accents[i] + '" onclick="goSection(\'' + sec.id + '\')">';
      h += '<span class="card-icon">' + sec.icon + '</span>';
      h += '<span class="card-title">' + sec.title + '</span>';
      h += '<span class="card-subtitle">' + sec.subtitle + '</span>';
      h += '</div>';
    }
    // More card
    h += '<div class="card card-accent-more" onclick="showToast(\'敬请期待...\', \'🚧\')">';
    h += '<span class="card-icon">✨</span>';
    h += '<span class="card-title">更多+</span>';
    h += '<span class="card-subtitle">更多精彩内容</span>';
    h += '</div>';
    h += '</div>';

    viewHome.innerHTML = h;
  }

  // Render Sub
  function renderSub() {
    var sec = sections[nav.sectionIndex];
    var h = '';
    h += '<div class="section-header">';
    h += '<span class="section-header-icon">' + sec.icon + '</span>';
    h += '<div class="section-header-title">' + sec.title + '</div>';
    h += '<div class="section-header-desc">' + sec.desc + '</div>';
    h += '</div>';
    h += '<div class="card-grid">';
    for (var i = 0; i < sec.items.length; i++) {
      var item = sec.items[i];
      var accent = item.tier === 'premium' ? 'card-accent-gold' : (item.tier === 'mid' ? 'card-accent-silver' : (item.tier === 'eco' ? 'card-accent-green' : 'card-accent-blue'));
      h += '<div class="card ' + accent + '" onclick="goDetail(\'' + item.id + '\')">';
      h += '<span class="card-icon">' + (item.tier === 'premium' ? '⭐' : (item.tier === 'mid' ? '🔷' : (item.tier === 'eco' ? '🌿' : '📊'))) + '</span>';
      h += '<span class="card-title">' + item.name + '</span>';
      h += '<span class="card-subtitle">' + item.tag + '</span>';
      h += '</div>';
    }
    h += '</div>';
    viewSub.innerHTML = h;
  }

  // Render Detail
  function renderDetail() {
    var sec = sections[nav.sectionIndex];
    var item = sec.items[nav.itemIndex];
    var h = '';

    // Back button
    h += '<div class="back-btn" onclick="goBack()">← 返回</div>';

    // Hero
    var heroClass = item.tier === 'premium' ? 'premium' : (item.tier === 'mid' ? 'mid' : (item.tier === 'eco' ? 'eco' : ''));
    h += '<div class="detail-hero ' + heroClass + '">';
    if (item.badge) {
      var badgeClass = item.tier === 'premium' ? 'badge-premium' : (item.tier === 'mid' ? 'badge-mid' : (item.tier === 'eco' ? 'badge-eco' : 'badge-info'));
      h += '<span class="detail-badge ' + badgeClass + '">' + item.badge + '</span>';
    }
    h += '<h2>' + item.name + '</h2>';
    h += '<div class="tagline">' + item.tag + '</div>';
    if (item.desc) h += '<p style="margin-top:8px;font-size:12px;opacity:0.8;">' + item.desc + '</p>';
    h += '</div>';

    // Specs grid
    if (item.specs && item.specs.length > 0) {
      h += '<div class="spec-grid">';
      for (var i = 0; i < item.specs.length; i++) {
        var sp = item.specs[i];
        h += '<div class="spec-card">';
        h += '<div class="spec-value' + (sp.color ? ' ' + sp.color : '') + '">' + sp.value + '</div>';
        h += '<div class="spec-label">' + sp.label + '</div>';
        h += '</div>';
      }
      h += '</div>';
    }

    // Sub products
    if (item.subProducts) {
      for (var i = 0; i < item.subProducts.length; i++) {
        var sp = item.subProducts[i];
        h += '<div class="info-card">';
        h += '<h3>' + sp.name + '</h3>';
        h += '<ul>';
        for (var j = 0; j < sp.features.length; j++) {
          h += '<li>' + sp.features[j] + '</li>';
        }
        h += '</ul></div>';
      }
    }

    // Tech details
    if (item.techDetails) {
      for (var i = 0; i < item.techDetails.length; i++) {
        var td = item.techDetails[i];
        h += '<div class="info-card">';
        h += '<h3>' + td.name + '</h3>';
        h += '<p>' + td.desc + '</p>';
        h += '</div>';
      }
    }

    // Tech tags
    if (item.tech) {
      h += '<div class="tag-row">';
      for (var i = 0; i < item.tech.length; i++) {
        h += '<span class="tag">' + item.tech[i] + '</span>';
      }
      h += '</div>';
    }

    // Features list
    if (item.features && !item.steps) {
      h += '<div class="info-card"><h3>产品特性</h3><ul>';
      for (var i = 0; i < item.features.length; i++) {
        h += '<li>' + item.features[i] + '</li>';
      }
      h += '</ul></div>';
    }

    // Sizes
    if (item.sizes) {
      h += '<div class="info-card"><h3>产品规格</h3><p>' + item.sizes + '</p></div>';
    }

    // Reference
    if (item.reference) {
      h += '<div class="info-card"><h3>参考用量</h3><p>' + item.reference + '</p></div>';
    }

    // Process steps
    if (item.steps) {
      h += '<div class="process-steps">';
      for (var i = 0; i < item.steps.length; i++) {
        var step = item.steps[i];
        h += '<div class="process-step">';
        h += '<div class="process-step-num">' + (i + 1) + '</div>';
        h += '<div class="process-step-content">';
        h += '<h4>' + step.title + '</h4>';
        h += '<p>' + step.desc + '</p>';
        h += '</div></div>';
      }
      h += '</div>';
    }

    // Brand context card
    if (item.brandContext) {
      h += '<div class="info-card" style="background:linear-gradient(135deg, #f8fafc, #e8f4fd);border-left:3px solid var(--knauf-deep);">' + item.brandContext + '</div>';
    }

    // Comparison bar chart
    if (item.comparison) {
      var comp = item.comparison;
      h += '<div class="info-card"><h3>性能对比</h3>';
      if (item.comparisonNote) {
        h += '<p style="font-size:11px;color:var(--text-muted);margin-bottom:12px;">' + item.comparisonNote + '</p>';
      }
      var maxVal = 0;
      for (var i = 0; i < comp.metrics.length; i++) {
        var vals = [comp.knauf[i], comp.competitor[i], comp.standard[i]];
        for (var j = 0; j < vals.length; j++) {
          if (vals[j] > maxVal) maxVal = vals[j];
        }
      }
      for (var i = 0; i < comp.metrics.length; i++) {
        h += '<div class="bar-row">';
        h += '<div class="bar-labels"><span class="bar-label-name">' + comp.metrics[i] + '</span><span class="bar-label-value">可耐福 ' + comp.knauf[i] + '</span></div>';
        h += '<div class="bar-track"><div class="bar-fill knauf" style="width:' + (comp.knauf[i] / maxVal * 100) + '%"></div></div>';
        h += '<div class="bar-labels" style="margin-top:3px;"><span style="font-size:11px;color:var(--text-muted);">' + comp.competitorName + '</span><span style="font-size:11px;color:var(--text-muted);">' + comp.competitor[i] + '</span></div>';
        h += '<div class="bar-track"><div class="bar-fill competitor" style="width:' + (comp.competitor[i] / maxVal * 100) + '%"></div></div>';
        h += '<div class="bar-labels" style="margin-top:3px;"><span style="font-size:11px;color:var(--text-muted);">' + comp.standardName + '</span><span style="font-size:11px;color:var(--text-muted);">' + comp.standard[i] + '</span></div>';
        h += '<div class="bar-track"><div class="bar-fill standard" style="width:' + (comp.standard[i] / maxVal * 100) + '%"></div></div>';
        h += '</div>';
      }
      h += '<div class="bar-legend"><div class="bar-legend-item"><div class="bar-legend-dot knauf"></div> 可耐福</div><div class="bar-legend-item"><div class="bar-legend-dot competitor"></div> ' + comp.competitorName + '</div><div class="bar-legend-item"><div class="bar-legend-dot standard"></div> ' + comp.standardName + '</div></div>';
      h += '</div>';
    }

    // Function comparison table
    if (item.functionCompare) {
      var fc = item.functionCompare;
      h += '<div class="info-card"><h3>增益功能对比</h3>';
      h += '<div style="overflow-x:auto;"><table class="comp-table"><thead><tr>';
      for (var i = 0; i < fc.headers.length; i++) {
        h += '<th>' + fc.headers[i] + '</th>';
      }
      h += '</tr></thead><tbody>';
      for (var i = 0; i < fc.rows.length; i++) {
        h += '<tr>';
        for (var j = 0; j < fc.rows[i].length; j++) {
          var val = fc.rows[i][j];
          var cls = '';
          if (val === '✓') cls = 'check';
          else if (val === '—') cls = 'cross';
          if (j > 0 && j < fc.rows[i].length - 1 && val !== '—') cls += ' highlight';
          h += '<td class="' + cls + '">' + val + '</td>';
        }
        h += '</tr>';
      }
      h += '</tbody></table></div></div>';
    }

    viewDetail.innerHTML = h;

    // Animate bar charts after render
    setTimeout(function() {
      var bars = viewDetail.querySelectorAll('.bar-fill');
      for (var i = 0; i < bars.length; i++) {
        bars[i].style.width = bars[i].style.width;
      }
    }, 50);
  }

  // Init
  init();
})();
</script>
</body>
</html>
